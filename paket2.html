<div class="container-slideshow-form">

	<!-- Content -->
		
	<!-- Slideshow container -->
	<div class="slideshow-container">

			<!-- Full-width images with number and caption text -->
			<div class="mySlides fade">
			<img src="images/paket2/1.jpeg" style="width:100%">
			</div>
		
			<div class="mySlides fade">
			<img src="images/paket2/2.jpeg" style="width:100%">
			</div>

			<div class="mySlides fade">
			<img src="images/paket2/3.jpeg" style="width:100%">
			</div>

			<div class="mySlides fade">
			<img src="images/paket2/4.jpeg" style="width:100%">
			</div>

			<div class="mySlides fade">
			<img src="images/paket2/5.jpeg" style="width:100%">
			</div>
		
			<!-- Next and previous buttons -->
			<a class="prev" onclick="plusSlides(-1)">&#10094;</a>
			<a class="next" onclick="plusSlides(1)">&#10095;</a>
		
		<br>
		
		<!-- The dots/circles -->
		<div style="text-align:center">
			<span class="dot" onclick="currentSlide(1)"></span>
			<span class="dot" onclick="currentSlide(2)"></span>
			<span class="dot" onclick="currentSlide(3)"></span>
			<span class="dot" onclick="currentSlide(4)"></span>
			<span class="dot" onclick="currentSlide(5)"></span>
		</div>
	</div>

	<!-- contact form -->
	<div class="form-buy-container">
		<form method="post" action="/thank-you.html" data-netlify="true" name="packet-buyer">
			<header class="major">
				<h2>Paket 2</h2>		
			</header>
			<input type="hidden" name="buyer-form" value="packet-buyer" />

			<div class="form-buy">
				<input type="hidden" name="paket:" value="paket2">

				<label for="email">Mejl:</label>
				<input type="text" id="email" name="email" placeholder="example@example.com">
				
				<label for="fname">Broj telefona:</label>
				<input type="text" id="number" name="broj tel" placeholder="065-123-456">
			
				<label for="lname">Ime i prezime:</label>
				<input type="text" id="name_surname" name="ime prezime" placeholder="Ana Anić">
			
				<label for="description">Opis šta želite:</label>
				<input type="text" id="description" name="opis" placeholder="Karikatura mene i moga psa sa jaknom...">
			
				<label for="datum">Datum kada želite da preuzmete:</label>
				<input type="date" id="datum" name="datum">
				
				<label for="slike">Ubacite slike:</label>
				<input type="file" id="slike" name="slike" accept="image/*">

				<label for="slike">Da li želite uslugu uramljivanja?</label>
				<div class="radio-container">
					<input type="radio" id="da" name="choice" value="da">
					<label for="da">Da</label>
	
					<input type="radio" id="ne" checked name="choice" value="ne">
					<label for="ne">Ne</label>
				</div>

				<input type="submit" value="Pošalji">
			</div>
		</form>
	</div>
						

</div>
